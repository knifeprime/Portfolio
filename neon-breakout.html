<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NeonBreak — Breakout Game</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#050508;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Orbitron',monospace;color:#fff;}
.back-bar{width:100%;padding:12px 24px;border-bottom:1px solid rgba(255,255,255,.06);}
.back-bar a{color:rgba(255,255,255,.3);font-size:11px;text-decoration:none;letter-spacing:1px;}
.back-bar a:hover{color:#fff;}
.game-header{display:flex;gap:36px;padding:18px;align-items:center;}
.hud-item{text-align:center;}
.hud-val{font-size:22px;font-weight:700;color:#00f5ff;}
.hud-lbl{font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.3);margin-top:2px;}
.lives{display:flex;gap:6px;align-items:center;}
.life-dot{width:10px;height:10px;border-radius:50%;background:#ff4757;}
canvas{border-radius:8px;box-shadow:0 0 60px rgba(0,245,255,.15);cursor:none;display:block;}
.hint{font-size:10px;color:rgba(255,255,255,.3);letter-spacing:2px;margin-top:12px;}
</style>
</head>
<body>
<div class="back-bar"><a href="index.html">← PORTFOLIO</a></div>
<div class="game-header">
  <div class="hud-item"><div class="hud-val" id="scoreEl">0</div><div class="hud-lbl">SCORE</div></div>
  <div class="hud-item"><div class="hud-val" id="levelEl">1</div><div class="hud-lbl">LEVEL</div></div>
  <div class="hud-item">
    <div class="lives" id="livesEl">
      <div class="life-dot"></div><div class="life-dot"></div><div class="life-dot"></div>
    </div>
    <div class="hud-lbl">LIVES</div>
  </div>
  <div class="hud-item"><div class="hud-val" id="bestEl">0</div><div class="hud-lbl">BEST</div></div>
</div>
<canvas id="c"></canvas>
<p class="hint">MOUSE / TOUCH TO MOVE PADDLE · SPACE TO START</p>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width = Math.min(520, innerWidth - 20);
const H = canvas.height = Math.min(640, innerHeight - 200);

// Paddle
const pad = { w: 90, h: 12, y: H - 30, x: W/2 - 45, speed: 0 };
// Ball
const ball = { x: W/2, y: H/2, r: 7, vx: 3, vy: -3.5, speed: 3.5 };
// Game
let state = 'idle', score = 0, best = parseInt(localStorage.getItem('breakout_best')||'0'), lives = 3, level = 1;
let bricks = [], particles = [];

// Colors per level
const BRICK_COLORS = [
  ['#ff4757','#ff6b81','#ff8c00','#ffa502','#eccc68','#7bed9f'],
  ['#5352ed','#70a1ff','#00d4ff','#00f5a0','#7bed9f','#fff'],
  ['#ff4757','#ff6348','#ff7f50','#ffa502','#ffd32a','#7bed9f'],
];

function makeBricks() {
  bricks = [];
  const rows = Math.min(3 + level, 8), cols = Math.floor((W - 20) / 62);
  const bw = (W - 20) / cols - 4;
  const colors = BRICK_COLORS[(level-1)%BRICK_COLORS.length];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      bricks.push({
        x: 10 + c * (bw + 4),
        y: 40 + r * 24,
        w: bw, h: 18,
        color: colors[r % colors.length],
        hits: r < 2 ? 1 : (Math.random() > 0.7 ? 2 : 1),
        alive: true,
      });
    }
  }
}

function spawnParticles(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 40, maxLife: 40, color, size: 1.5 + Math.random()*3
    });
  }
}

function resetBall() {
  ball.x = pad.x + pad.w/2;
  ball.y = pad.y - ball.r - 2;
  const angle = (Math.random() * 0.6 - 0.3) - Math.PI/2;
  const spd = ball.speed;
  ball.vx = Math.cos(angle) * spd;
  ball.vy = Math.sin(angle) * spd;
}

function updateLives() {
  document.getElementById('livesEl').innerHTML = Array.from({length:lives},()=>'<div class="life-dot"></div>').join('');
}

function drawGlow(x, y, r, color) {
  const g = ctx.createRadialGradient(x,y,0,x,y,r*3);
  g.addColorStop(0, color+'66'); g.addColorStop(1, 'transparent');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r*3,0,Math.PI*2); ctx.fill();
}

let flashTimer = 0;

function loop() {
  requestAnimationFrame(loop);
  ctx.fillStyle = 'rgba(5,5,8,0.3)'; ctx.fillRect(0,0,W,H);

  // Particles
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.95; p.vy*=0.95; p.life--;
    ctx.globalAlpha = p.life/p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Paddle glow
  drawGlow(pad.x+pad.w/2, pad.y+pad.h/2, 20, '#00f5ff');
  ctx.fillStyle = '#00f5ff';
  ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.roundRect(pad.x, pad.y, pad.w, pad.h, 6);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Ball glow
  drawGlow(ball.x, ball.y, ball.r, '#ff6b81');
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#ff6b81'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Bricks
  bricks.filter(b=>b.alive).forEach(b => {
    ctx.fillStyle = b.hits > 1 ? b.color+'88' : b.color;
    ctx.shadowColor = b.color; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 4); ctx.fill();
    ctx.shadowBlur = 0;
    if (b.hits > 1) {
      ctx.strokeStyle = '#fff3'; ctx.lineWidth = 1;
      ctx.strokeRect(b.x+2, b.y+2, b.w-4, b.h-4);
    }
  });

  if (flashTimer > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flashTimer/20*0.3})`; ctx.fillRect(0,0,W,H);
    flashTimer--;
  }

  // Overlay
  if (state === 'idle') {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#00f5ff'; ctx.font = 'bold 28px Orbitron'; ctx.textAlign = 'center';
    ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 20;
    ctx.fillText('NEON BREAK', W/2, H/2-40);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff6'; ctx.font = '11px Orbitron';
    ctx.fillText('PRESS SPACE OR CLICK TO START', W/2, H/2+10);
    return;
  }
  if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#ff4757'; ctx.font = 'bold 26px Orbitron'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2-30);
    ctx.fillStyle = '#fff'; ctx.font = '13px Orbitron';
    ctx.fillText('SCORE: ' + score, W/2, H/2+10);
    ctx.fillStyle = '#ffda44'; ctx.font = '11px Orbitron';
    ctx.fillText('PRESS SPACE TO RETRY', W/2, H/2+40);
    return;
  }
  if (state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#7bed9f'; ctx.font = 'bold 24px Orbitron'; ctx.textAlign = 'center';
    ctx.fillText('LEVEL ' + level + ' CLEAR!', W/2, H/2-20);
    ctx.fillStyle = '#fff'; ctx.font = '11px Orbitron';
    ctx.fillText('PRESS SPACE FOR NEXT LEVEL', W/2, H/2+20);
    return;
  }

  if (state !== 'playing') return;

  // Physics
  ball.x += ball.vx; ball.y += ball.vy;

  // Wall bounce
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
  if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

  // Paddle collision
  if (ball.y + ball.r >= pad.y && ball.y - ball.r <= pad.y + pad.h &&
      ball.x >= pad.x - 5 && ball.x <= pad.x + pad.w + 5 && ball.vy > 0) {
    const hit = (ball.x - (pad.x + pad.w/2)) / (pad.w/2);
    ball.vx = hit * 5;
    ball.vy = -Math.abs(ball.vy);
    const spd = Math.hypot(ball.vx, ball.vy);
    ball.vx = (ball.vx/spd) * ball.speed;
    ball.vy = (ball.vy/spd) * ball.speed;
    spawnParticles(ball.x, pad.y, '#00f5ff', 6);
  }

  // Bottom = lose life
  if (ball.y - ball.r > H) {
    spawnParticles(ball.x, H-10, '#ff4757', 15);
    lives--;
    updateLives();
    if (lives <= 0) {
      state = 'dead';
      if (score > best) { best = score; localStorage.setItem('breakout_best', best); document.getElementById('bestEl').textContent = best; }
      return;
    }
    flashTimer = 15;
    resetBall();
    state = 'ready';
    setTimeout(() => { if(state==='ready') state='playing'; }, 600);
  }

  // Brick collision
  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
        ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
      b.hits--;
      if (b.hits <= 0) {
        b.alive = false;
        score += 10 * level;
        document.getElementById('scoreEl').textContent = score;
        spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color, 16);
      } else {
        spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color, 6);
      }
      const overlapX = Math.min(Math.abs(ball.x - b.x), Math.abs(ball.x - (b.x+b.w)));
      const overlapY = Math.min(Math.abs(ball.y - b.y), Math.abs(ball.y - (b.y+b.h)));
      if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;
      break;
    }
  }

  // Win check
  if (bricks.every(b=>!b.alive)) { state = 'win'; }
}

function start() {
  if (state === 'idle') {
    makeBricks(); resetBall(); state = 'playing';
  } else if (state === 'dead') {
    score = 0; lives = 3; level = 1;
    document.getElementById('scoreEl').textContent = 0;
    document.getElementById('levelEl').textContent = 1;
    updateLives(); makeBricks(); resetBall(); state = 'playing';
  } else if (state === 'win') {
    level++;
    ball.speed = 3.5 + level * 0.3;
    document.getElementById('levelEl').textContent = level;
    makeBricks(); resetBall(); state = 'playing';
  }
}

document.addEventListener('keydown', e => { if(e.code==='Space'){e.preventDefault();start();} });
canvas.addEventListener('click', start);

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  pad.x = Math.max(0, Math.min(W - pad.w, e.clientX - rect.left - pad.w/2));
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  pad.x = Math.max(0, Math.min(W - pad.w, e.touches[0].clientX - rect.left - pad.w/2));
}, {passive:false});

document.getElementById('bestEl').textContent = best;
makeBricks();
loop();
</script>
</body>
</html>
