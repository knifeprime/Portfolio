<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PaletteForge — Color Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--font:'Space Grotesk',sans-serif;--mono:'Space Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#111;color:#fff;font-family:var(--font);min-height:100vh;}
.back-bar{padding:12px 28px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px;}
.back-bar a{color:rgba(255,255,255,.5);font-size:13px;text-decoration:none;}.back-bar a:hover{color:#fff;}
.app{max-width:1100px;margin:0 auto;padding:40px 20px 80px;}
.top{text-align:center;margin-bottom:48px;}
.top h1{font-size:clamp(28px,5vw,48px);font-weight:700;letter-spacing:-1px;}
.top h1 span{background:linear-gradient(135deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.top p{color:rgba(255,255,255,.5);font-size:15px;margin:10px 0 28px;}
.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.ctrl-btn{padding:12px 24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;font-family:var(--font);font-size:14px;font-weight:600;border-radius:50px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:8px;}
.ctrl-btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);}
.ctrl-btn.primary{background:#4d96ff;border-color:#4d96ff;}
.ctrl-btn.primary:hover{background:#6aaaff;}
.kbd{background:rgba(255,255,255,.1);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:11px;}
/* Palette */
.palette{display:flex;height:420px;border-radius:16px;overflow:hidden;margin-bottom:32px;gap:3px;background:rgba(255,255,255,.05);}
.swatch{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 14px;cursor:pointer;transition:flex .35s cubic-bezier(.22,1,.36,1);}
.swatch:hover{flex:1.5;}
.swatch-info{opacity:0;transform:translateY(8px);transition:all .25s;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border-radius:10px;padding:12px;}
.swatch:hover .swatch-info{opacity:1;transform:translateY(0);}
.swatch-hex{font-family:var(--mono);font-size:15px;font-weight:700;}
.swatch-rgb{font-family:var(--mono);font-size:11px;opacity:.7;margin-top:2px;}
.lock-btn{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;}
.swatch:hover .lock-btn{opacity:1;}
.lock-btn.locked{opacity:1!important;background:rgba(255,255,255,.25);}
/* CSS Export */
.export-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px;margin-bottom:24px;}
.export-card h3{font-size:14px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;}
.css-output{background:#0d1117;border-radius:8px;padding:16px;font-family:var(--mono);font-size:12px;color:#e6edf3;line-height:1.8;overflow-x:auto;}
.css-output .prop{color:#79c0ff;}
.css-output .val{color:#a5d6ff;}
/* Harmony buttons */
.harmony-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px;justify-content:center;}
.h-btn{padding:7px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;color:rgba(255,255,255,.6);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:.2s;}
.h-btn:hover,.h-btn.active{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:#222;border:1px solid rgba(255,255,255,.1);border-radius:50px;padding:10px 20px;font-size:13px;transition:.3s;z-index:99;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="back-bar"><a href="../index.html">← Portfolio</a></div>
<div class="app">
  <div class="top">
    <h1>Palette<span>Forge</span></h1>
    <p>Generate, lock, and export beautiful color palettes. Press Space to generate a new one.</p>
    <div class="controls">
      <button class="ctrl-btn primary" onclick="generate()">🎲 Generate <span class="kbd">Space</span></button>
      <button class="ctrl-btn" onclick="addSwatch()">+ Add Color</button>
      <button class="ctrl-btn" onclick="copyCss()">📋 Copy CSS</button>
      <button class="ctrl-btn" onclick="exportPng()">🖼️ Download</button>
    </div>
  </div>

  <div class="harmony-row">
    <button class="h-btn active" onclick="setMode('random',this)">Random</button>
    <button class="h-btn" onclick="setMode('analogous',this)">Analogous</button>
    <button class="h-btn" onclick="setMode('complementary',this)">Complementary</button>
    <button class="h-btn" onclick="setMode('triadic',this)">Triadic</button>
    <button class="h-btn" onclick="setMode('monochromatic',this)">Monochromatic</button>
  </div>

  <div class="palette" id="palette"></div>

  <div class="export-card">
    <h3>CSS Variables</h3>
    <div class="css-output" id="cssOutput"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let swatches = [];
let locked = [];
let mode = 'random';

function hslToHex(h,s,l){
  s/=100;l/=100;
  const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,'0');};
  return '#'+f(0)+f(8)+f(4);
}
function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgb(${r}, ${g}, ${b})`;}
function hexToHsl(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;}h/=6;}return [Math.round(h*360),Math.round(s*100),Math.round(l*100)];}
function luminance(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;return 0.299*r+0.587*g+0.114*b;}
function textColor(hex){return luminance(hex)>0.5?'#111':'#fff';}
function rnd(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function generate(){
  const count = swatches.length || 5;
  const baseH = rnd(0,359);
  const newSwatches = [];
  for(let i=0;i<count;i++){
    if(locked[i]){newSwatches.push(swatches[i]);continue;}
    let h,s,l;
    switch(mode){
      case 'analogous':    h=(baseH+i*30)%360;s=rnd(55,75);l=rnd(40,65);break;
      case 'complementary':h=i%2===0?baseH:(baseH+180)%360;s=rnd(55,80);l=rnd(35,70);break;
      case 'triadic':      h=(baseH+i*120)%360;s=rnd(55,75);l=rnd(40,65);break;
      case 'monochromatic':h=baseH;s=rnd(30,80);l=20+i*12;break;
      default:             h=rnd(0,359);s=rnd(45,85);l=rnd(35,70);
    }
    newSwatches.push(hslToHex(h,s,l));
  }
  swatches=newSwatches;
  render();
}

function addSwatch(){if(swatches.length>=8)return;swatches.push(hslToHex(rnd(0,359),rnd(45,80),rnd(40,65)));locked.push(false);render();}

function toggleLock(i){locked[i]=!locked[i];render();}

function setMode(m,btn){mode=m;document.querySelectorAll('.h-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');generate();}

function render(){
  const pal = document.getElementById('palette');
  pal.innerHTML = swatches.map((hex,i)=>`
    <div class="swatch" style="background:${hex};color:${textColor(hex)}">
      <button class="lock-btn${locked[i]?' locked':''}" onclick="toggleLock(${i})">${locked[i]?'🔒':'🔓'}</button>
      <div class="swatch-info" onclick="copyHex('${hex}')">
        <div class="swatch-hex">${hex.toUpperCase()}</div>
        <div class="swatch-rgb">${hexToRgb(hex)}</div>
        <div style="font-size:11px;opacity:.6;margin-top:4px;">Click to copy</div>
      </div>
    </div>`).join('');

  const css = swatches.map((hex,i)=>`  <span class="prop">--color-${i+1}</span>: <span class="val">${hex.toUpperCase()}</span>;`).join('\n');
  document.getElementById('cssOutput').innerHTML = `:root {\n${css}\n}`;
}

function copyHex(hex){navigator.clipboard.writeText(hex);showToast('Copied '+hex.toUpperCase());}

function copyCss(){
  const css = ':root {\n'+swatches.map((h,i)=>`  --color-${i+1}: ${h.toUpperCase()};`).join('\n')+'\n}';
  navigator.clipboard.writeText(css);showToast('CSS variables copied!');}

function exportPng(){
  const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=400;
  const ctx=canvas.getContext('2d');const w=1200/swatches.length;
  swatches.forEach((hex,i)=>{ctx.fillStyle=hex;ctx.fillRect(i*w,0,w,400);ctx.fillStyle=textColor(hex);ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.fillText(hex.toUpperCase(),i*w+w/2,230);});
  const a=document.createElement('a');a.href=canvas.toDataURL();a.download='palette.png';a.click();showToast('Image downloaded!');
}

let toastT;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();generate();}});

// Init
for(let i=0;i<5;i++){swatches.push('');locked.push(false);}
generate();
</script>
</body>
</html>
