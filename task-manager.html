<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TaskPro — Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--s1:#161b27;--s2:#1e2536;--accent:#7c6af5;--green:#22d3a5;--red:#f25858;--yellow:#f5c842;--text:#e8eaf0;--muted:#6b7280;--border:rgba(255,255,255,0.07);--r:12px;--font:'Plus Jakarta Sans',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:0;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 50% 40% at 70% 10%,rgba(124,106,245,0.08),transparent 70%);pointer-events:none;}
.back-bar{background:var(--s1);padding:12px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.back-bar a{color:var(--muted);font-size:13px;text-decoration:none;transition:.2s;}.back-bar a:hover{color:var(--text);}
.app{max-width:1000px;margin:0 auto;padding:32px 20px 80px;}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
h1 span{color:var(--accent);}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:32px;}
/* Summary */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px;}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:18px;}
.stat-num{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;}
.stat-label{font-size:12px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}
/* Add task */
.add-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:24px;}
.add-card h3{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.add-card h3::before{content:'✦';color:var(--accent);}
.form-row{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:end;}
@media(max-width:640px){.form-row{grid-template-columns:1fr;}}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.field input,.field select{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:.2s;-webkit-appearance:none;}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,106,245,.15);}
.field input::placeholder{color:var(--muted);}
.field select option{background:var(--s2);}
.add-btn{padding:11px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s;}
.add-btn:hover{background:#9183f7;box-shadow:0 0 18px rgba(124,106,245,.4);}
/* Filters */
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.fchip{padding:6px 14px;background:var(--s1);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font);transition:.2s;}
.fchip.active,.fchip:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.clear-done{margin-left:auto;padding:6px 14px;background:none;border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font);transition:.2s;}
.clear-done:hover{color:var(--red);border-color:var(--red);}
/* Task list */
.tasks{display:flex;flex-direction:column;gap:8px;}
.task{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;transition:.25s;animation:taskIn .3s ease;}
@keyframes taskIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.task:hover{border-color:rgba(124,106,245,.25);transform:translateX(2px);}
.task.done{opacity:.45;}
.task.done .task-title{text-decoration:line-through;color:var(--muted);}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;background:transparent;}
.check:hover{border-color:var(--accent);}
.task.done .check{background:var(--green);border-color:var(--green);color:#fff;}
.check-icon{font-size:11px;}
.task-body{flex:1;min-width:0;}
.task-title{font-size:14px;font-weight:600;}
.task-meta{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;}
.task-tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;}
.priority-high{background:rgba(242,88,88,.15);color:var(--red);}
.priority-med{background:rgba(245,200,66,.12);color:var(--yellow);}
.priority-low{background:rgba(34,211,165,.12);color:var(--green);}
.cat-tag{background:rgba(124,106,245,.12);color:var(--accent);font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;}
.due-tag{font-size:11px;color:var(--muted);padding:2px 8px;background:var(--s2);border-radius:4px;}
.due-tag.overdue{color:var(--red);}
.task-del{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:4px;border-radius:6px;transition:.2s;flex-shrink:0;}
.task-del:hover{color:var(--red);background:rgba(242,88,88,.1);}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;}
/* Progress */
.progress-bar{height:6px;background:var(--s2);border-radius:6px;margin-bottom:24px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:6px;transition:width .6s cubic-bezier(.22,1,.36,1);}
</style>
</head>
<body>
<div class="back-bar"><a href="../index.html">← Portfolio</a></div>
<div class="app">
  <h1>Task<span>Pro</span></h1>
  <div class="subtitle">Stay organized. Get things done.</div>

  <div class="stats-row">
    <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--green)" id="statDone">0</div><div class="stat-label">Done</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--yellow)" id="statPending">0</div><div class="stat-label">Pending</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--red)" id="statOverdue">0</div><div class="stat-label">Overdue</div></div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="add-card">
    <h3>Add New Task</h3>
    <div class="form-row">
      <div class="field" style="min-width:0;">
        <label>Task</label>
        <input type="text" id="taskInput" placeholder="What needs to be done?">
      </div>
      <div class="field">
        <label>Priority</label>
        <select id="priorityInput">
          <option value="high">🔴 High</option>
          <option value="med" selected>🟡 Medium</option>
          <option value="low">🟢 Low</option>
        </select>
      </div>
      <div class="field">
        <label>Category</label>
        <select id="catInput">
          <option>Work</option><option>Personal</option><option>Health</option>
          <option>Finance</option><option>Learning</option><option>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Due Date</label>
        <input type="date" id="dueInput">
      </div>
    </div>
    <button class="add-btn" onclick="addTask()" style="margin-top:12px;width:100%;">+ Add Task</button>
  </div>

  <div class="filter-bar">
    <button class="fchip active" onclick="setFilter('all',this)">All</button>
    <button class="fchip" onclick="setFilter('pending',this)">Pending</button>
    <button class="fchip" onclick="setFilter('done',this)">Done</button>
    <button class="fchip" onclick="setFilter('high',this)">🔴 High Priority</button>
    <button class="clear-done" onclick="clearDone()">Clear Done</button>
  </div>

  <div class="tasks" id="taskList"></div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem('taskpro')||'[]');
let filter = 'all';

const today = new Date().toISOString().split('T')[0];
document.getElementById('dueInput').value = today;

function save(){localStorage.setItem('taskpro',JSON.stringify(tasks));}

function addTask(){
  const title=document.getElementById('taskInput').value.trim();
  if(!title)return;
  tasks.unshift({id:Date.now(),title,priority:document.getElementById('priorityInput').value,cat:document.getElementById('catInput').value,due:document.getElementById('dueInput').value,done:false});
  document.getElementById('taskInput').value='';
  save();render();
}

function toggleDone(id){
  const t=tasks.find(t=>t.id===id);
  if(t)t.done=!t.done;
  save();render();
}

function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);save();render();}
function clearDone(){tasks=tasks.filter(t=>!t.done);save();render();}
function setFilter(f,btn){filter=f;document.querySelectorAll('.fchip').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}

function isOverdue(due){return due && due < today;}

function render(){
  const total=tasks.length,done=tasks.filter(t=>t.done).length,pending=total-done;
  const overdue=tasks.filter(t=>!t.done&&isOverdue(t.due)).length;
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statDone').textContent=done;
  document.getElementById('statPending').textContent=pending;
  document.getElementById('statOverdue').textContent=overdue;
  document.getElementById('progressFill').style.width=total?((done/total)*100)+'%':'0%';

  let visible=tasks;
  if(filter==='pending')visible=tasks.filter(t=>!t.done);
  if(filter==='done')visible=tasks.filter(t=>t.done);
  if(filter==='high')visible=tasks.filter(t=>t.priority==='high'&&!t.done);

  const el=document.getElementById('taskList');
  if(!visible.length){el.innerHTML='<div class="empty">🎉 Nothing here — add a task above!</div>';return;}

  el.innerHTML=visible.map(t=>{
    const od=isOverdue(t.due);
    return `<div class="task${t.done?' done':''}">
      <div class="check" onclick="toggleDone(${t.id})"><span class="check-icon">${t.done?'✓':''}</span></div>
      <div class="task-body">
        <div class="task-title">${t.title}</div>
        <div class="task-meta">
          <span class="task-tag priority-${t.priority}">${{high:'🔴 High',med:'🟡 Medium',low:'🟢 Low'}[t.priority]}</span>
          <span class="cat-tag">${t.cat}</span>
          ${t.due?`<span class="due-tag${od?' overdue':''}">${od?'⚠️ Overdue — ':'📅 '}${t.due}</span>`:''}
        </div>
      </div>
      <button class="task-del" onclick="deleteTask(${t.id})">✕</button>
    </div>`;
  }).join('');
}

document.getElementById('taskInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});
render();
</script>
</body>
</html>
