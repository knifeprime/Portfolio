<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SnakeNeon — Snake Game</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#020408;color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 50%,rgba(0,255,136,.04),transparent 70%);pointer-events:none;}
.back-bar{width:100%;padding:12px 24px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;}
.back-bar a{color:rgba(255,255,255,.4);font-size:13px;text-decoration:none;}.back-bar a:hover{color:#fff;}
.app{display:flex;flex-direction:column;align-items:center;padding:24px 16px;}
h1{font-family:'Orbitron',monospace;font-size:clamp(20px,4vw,30px);font-weight:900;letter-spacing:2px;margin-bottom:4px;color:#00ff88;text-shadow:0 0 20px rgba(0,255,136,.5);}
.subtitle{color:rgba(255,255,255,.4);font-size:13px;margin-bottom:20px;}
/* HUD */
.hud{display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap;justify-content:center;}
.hud-item{background:rgba(0,255,136,.05);border:1px solid rgba(0,255,136,.15);border-radius:8px;padding:10px 18px;min-width:80px;text-align:center;}
.hud-val{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;color:#00ff88;}
.hud-lbl{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
/* Canvas wrapper */
.canvas-wrap{position:relative;}
canvas{border:2px solid rgba(0,255,136,.2);border-radius:4px;display:block;box-shadow:0 0 30px rgba(0,255,136,.1),inset 0 0 60px rgba(0,0,0,.5);}
.overlay-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(2,4,8,.85);border-radius:4px;text-align:center;gap:12px;}
.overlay-msg h2{font-family:'Orbitron',monospace;font-size:22px;color:#00ff88;text-shadow:0 0 15px rgba(0,255,136,.6);}
.overlay-msg p{color:rgba(255,255,255,.5);font-size:14px;}
.play-btn{padding:12px 32px;background:#00ff88;color:#020408;border:none;border-radius:8px;font-family:'Orbitron',monospace;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:.2s;}
.play-btn:hover{background:#00ffaa;box-shadow:0 0 20px rgba(0,255,136,.5);}
/* Mobile d-pad */
.dpad{display:none;margin-top:20px;grid-template-areas:'. up .' 'left . right' '. down .';grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px;}
@media(max-width:600px){.dpad{display:grid;}}
.dpad-btn{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.2);border-radius:8px;color:#00ff88;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;}
.dpad-btn:active{background:rgba(0,255,136,.25);}
.dpad-btn.up{grid-area:up;}.dpad-btn.down{grid-area:down;}.dpad-btn.left{grid-area:left;}.dpad-btn.right{grid-area:right;}
/* Speed row */
.speed-row{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;justify-content:center;}
.spd-btn{padding:5px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;color:rgba(255,255,255,.5);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;}
.spd-btn.active{background:rgba(0,255,136,.15);color:#00ff88;border-color:rgba(0,255,136,.3);}
</style>
</head>
<body>
<div class="back-bar"><a href="../index.html">← Portfolio</a></div>
<div class="app">
  <h1>SNAKE NEON</h1>
  <div class="subtitle">Use arrow keys or WASD. Collect food, avoid yourself.</div>
  <div class="hud">
    <div class="hud-item"><div class="hud-val" id="score">0</div><div class="hud-lbl">Score</div></div>
    <div class="hud-item"><div class="hud-val" id="best">0</div><div class="hud-lbl">Best</div></div>
    <div class="hud-item"><div class="hud-val" id="level">1</div><div class="hud-lbl">Level</div></div>
    <div class="hud-item"><div class="hud-val" id="length">3</div><div class="hud-lbl">Length</div></div>
  </div>
  <div class="speed-row">
    <button class="spd-btn active" onclick="setSpeed(150,this)">Slow</button>
    <button class="spd-btn" onclick="setSpeed(100,this)">Normal</button>
    <button class="spd-btn" onclick="setSpeed(65,this)">Fast</button>
    <button class="spd-btn" onclick="setSpeed(35,this)">Insane</button>
  </div>
  <div class="canvas-wrap">
    <canvas id="c"></canvas>
    <div class="overlay-msg" id="overlay">
      <h2>SNAKE NEON</h2>
      <p>Arrow Keys / WASD to move</p>
      <button class="play-btn" onclick="startGame()">▶ START</button>
    </div>
  </div>
  <div class="dpad">
    <button class="dpad-btn up" onclick="dir(0,-1)">▲</button>
    <button class="dpad-btn left" onclick="dir(-1,0)">◀</button>
    <button class="dpad-btn right" onclick="dir(1,0)">▶</button>
    <button class="dpad-btn down" onclick="dir(0,1)">▼</button>
  </div>
</div>
<script>
const CELL=20,COLS=25,ROWS=25;
const c=document.getElementById('c');c.width=COLS*CELL;c.height=ROWS*CELL;
const ctx=c.getContext('2d');
let snake,food,dx,dy,ndx,ndy,score,gameLoop,speed=150,running=false,best=parseInt(localStorage.getItem('snakeNeonBest')||'0');
document.getElementById('best').textContent=best;

function startGame(){
  snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];
  food=randomFood();dx=1;dy=0;ndx=1;ndy=0;score=0;
  document.getElementById('score').textContent=0;
  document.getElementById('length').textContent=3;
  document.getElementById('level').textContent=1;
  document.getElementById('overlay').style.display='none';
  clearInterval(gameLoop);gameLoop=setInterval(tick,speed);running=true;
}

function randomFood(){let f;do{f={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}while(snake&&snake.some(s=>s.x===f.x&&s.y===f.y));return f;}

function dir(x,y){
  if(x!==0&&dx===0){ndx=x;ndy=0;}
  if(y!==0&&dy===0){ndy=y;ndx=0;}
}

function tick(){
  dx=ndx;dy=ndy;
  const head={x:(snake[0].x+dx+COLS)%COLS,y:(snake[0].y+dy+ROWS)%ROWS};
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return;}
  snake.unshift(head);
  const ate=head.x===food.x&&head.y===food.y;
  if(ate){score+=10+(Math.floor(score/50)*5);food=randomFood();}
  else snake.pop();
  document.getElementById('score').textContent=score;
  document.getElementById('length').textContent=snake.length;
  document.getElementById('level').textContent=Math.floor(score/50)+1;
  draw();
}

function draw(){
  ctx.fillStyle='#020408';ctx.fillRect(0,0,c.width,c.height);
  // Grid dots
  ctx.fillStyle='rgba(0,255,136,.04)';
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){ctx.beginPath();ctx.arc(x*CELL+CELL/2,y*CELL+CELL/2,1,0,Math.PI*2);ctx.fill();}
  // Food glow
  ctx.save();ctx.shadowColor='#ff4d6d';ctx.shadowBlur=14;
  ctx.fillStyle='#ff4d6d';ctx.beginPath();ctx.roundRect(food.x*CELL+2,food.y*CELL+2,CELL-4,CELL-4,4);ctx.fill();
  ctx.restore();
  // Snake
  snake.forEach((s,i)=>{
    const alpha=0.4+0.6*(1-i/snake.length);
    ctx.save();
    ctx.shadowColor='#00ff88';ctx.shadowBlur=i===0?16:4;
    ctx.fillStyle=i===0?'#00ff88':`rgba(0,${Math.floor(180+75*(1-i/snake.length))},${Math.floor(80+76*(i/snake.length))},${alpha})`;
    ctx.beginPath();ctx.roundRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,i===0?6:4);ctx.fill();
    ctx.restore();
  });
}

function gameOver(){
  clearInterval(gameLoop);running=false;
  if(score>best){best=score;localStorage.setItem('snakeNeonBest',best);document.getElementById('best').textContent=best;}
  const ol=document.getElementById('overlay');
  ol.style.display='flex';
  ol.innerHTML=`<h2 style="color:#ff4d6d">GAME OVER</h2><p>Score: ${score} | Best: ${best}</p><button class="play-btn" onclick="startGame()">▶ RETRY</button>`;
}

function setSpeed(s,btn){speed=s;document.querySelectorAll('.spd-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(running){clearInterval(gameLoop);gameLoop=setInterval(tick,speed);}}

document.addEventListener('keydown',e=>{
  if(['ArrowUp','w','W'].includes(e.key))dir(0,-1);
  if(['ArrowDown','s','S'].includes(e.key))dir(0,1);
  if(['ArrowLeft','a','A'].includes(e.key))dir(-1,0);
  if(['ArrowRight','d','D'].includes(e.key))dir(1,0);
  if(e.key===' '&&!running)startGame();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
});

// Touch swipe
let tx,ty;
c.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
c.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){dir(dx>0?1:-1,0);}else{dir(0,dy>0?1:-1);}
});

// Init draw
ctx.fillStyle='#020408';ctx.fillRect(0,0,c.width,c.height);
</script>
</body>
</html>
