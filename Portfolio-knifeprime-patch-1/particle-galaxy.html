<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Particle Galaxy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;}
canvas{display:block;}
.ui{position:fixed;top:20px;left:20px;color:#fff;z-index:10;}
.ui h1{font-size:20px;font-weight:300;letter-spacing:4px;text-transform:uppercase;margin-bottom:6px;opacity:.8;}
.ui p{font-size:11px;opacity:.4;letter-spacing:1px;}
.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;}
.ctrl{padding:8px 18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#fff;font-size:12px;cursor:pointer;letter-spacing:1px;transition:.2s;}
.ctrl:hover{background:rgba(255,255,255,.18);}
.ctrl.active{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.6);}
.back{position:fixed;top:20px;right:20px;}
.back a{color:rgba(255,255,255,.4);font-size:12px;text-decoration:none;letter-spacing:1px;}
.back a:hover{color:#fff;}
</style>
</head>
<body>
<div class="ui">
  <h1>Particle Galaxy</h1>
  <p>MOVE MOUSE · CLICK TO EXPLODE</p>
</div>
<div class="controls">
  <button class="ctrl active" onclick="setMode('galaxy',this)">GALAXY</button>
  <button class="ctrl" onclick="setMode('vortex',this)">VORTEX</button>
  <button class="ctrl" onclick="setMode('wave',this)">WAVE</button>
  <button class="ctrl" onclick="setMode('chaos',this)">CHAOS</button>
</div>
<div class="back"><a href="index.html">← Back</a></div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = canvas.width = innerWidth;
let H = canvas.height = innerHeight;
let mode = 'galaxy';
let mouse = { x: W/2, y: H/2 };
let time = 0;

const N = Math.min(800, Math.floor(W*H/1500));
const particles = [];

class Particle {
  constructor() { this.reset(true); }
  reset(init) {
    if (mode === 'galaxy') {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * Math.min(W,H) * 0.45 + 20;
      this.ox = W/2 + Math.cos(angle) * radius;
      this.oy = H/2 + Math.sin(angle) * radius;
    } else {
      this.ox = Math.random() * W;
      this.oy = Math.random() * H;
    }
    this.x = init ? this.ox : W/2;
    this.y = init ? this.oy : H/2;
    this.vx = 0; this.vy = 0;
    this.size = Math.random() * 2.5 + 0.5;
    this.hue = Math.random() * 360;
    this.alpha = Math.random() * 0.8 + 0.2;
    this.life = Math.random() * 200 + 100;
    this.age = 0;
    this.speed = Math.random() * 0.02 + 0.005;
    this.offset = Math.random() * Math.PI * 2;
  }
  update() {
    this.age++;
    if (this.age > this.life) { this.reset(false); return; }
    const dx = mouse.x - this.x, dy = mouse.y - this.y;
    const dist = Math.sqrt(dx*dx+dy*dy);

    if (mode === 'galaxy') {
      const angle = Math.atan2(this.oy - H/2, this.ox - W/2) + time * this.speed;
      const r = Math.sqrt((this.ox-W/2)**2+(this.oy-H/2)**2);
      const tx = W/2 + Math.cos(angle)*r;
      const ty = H/2 + Math.sin(angle)*r;
      this.x += (tx - this.x) * 0.05;
      this.y += (ty - this.y) * 0.05;
      if (dist < 100) { this.x += dx * 0.02; this.y += dy * 0.02; }
    } else if (mode === 'vortex') {
      const angle = Math.atan2(this.y - H/2, this.x - W/2) + 0.03;
      const r = Math.sqrt((this.x-W/2)**2+(this.y-H/2)**2);
      this.vx = Math.cos(angle)*r*0.015 - (this.x - W/2)*0.005;
      this.vy = Math.sin(angle)*r*0.015 - (this.y - H/2)*0.005;
      this.x += this.vx; this.y += this.vy;
      if (dist < 120) { this.x += dx*0.03; this.y += dy*0.03; }
    } else if (mode === 'wave') {
      this.x += (this.ox - this.x) * 0.03 + 1.5;
      if (this.x > W + 10) this.x -= W + 20;
      this.y = this.oy + Math.sin(this.x * 0.02 + time * 0.05 + this.offset) * 60;
      if (dist < 100) { this.y += dy * 0.05; }
    } else {
      this.vx += (Math.random()-0.5)*0.5;
      this.vy += (Math.random()-0.5)*0.5;
      this.vx *= 0.98; this.vy *= 0.98;
      if (dist < 150) { this.vx += dx*0.01; this.vy += dy*0.01; }
      this.x += this.vx; this.y += this.vy;
      if (this.x < 0 || this.x > W) this.vx *= -1;
      if (this.y < 0 || this.y > H) this.vy *= -1;
    }
    this.hue += 0.3;
  }
  draw() {
    const fade = Math.min(this.age / 20, 1) * Math.min((this.life-this.age)/20, 1);
    ctx.globalAlpha = this.alpha * fade;
    ctx.fillStyle = `hsl(${this.hue},90%,70%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
  }
}

for (let i = 0; i < N; i++) particles.push(new Particle());

function explode(x, y) {
  particles.forEach(p => {
    const dx = p.x - x, dy = p.y - y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if (dist < 200) {
      p.vx = (dx / dist) * (200-dist) * 0.08;
      p.vy = (dy / dist) * (200-dist) * 0.08;
    }
  });
}

function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.ctrl').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  particles.forEach(p => p.reset(false));
}

function loop() {
  requestAnimationFrame(loop);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = 1;
  particles.forEach(p => { p.update(); p.draw(); });
  time++;
}

canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('click', e => explode(e.clientX, e.clientY));
canvas.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchstart', e => explode(e.touches[0].clientX, e.touches[0].clientY));
window.addEventListener('resize', () => { W = canvas.width = innerWidth; H = canvas.height = innerHeight; });

loop();
</script>
</body>
</html>
