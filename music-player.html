<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GrooveBox — Music Player</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d14;--s1:#14141f;--s2:#1c1c2a;--accent:#a855f7;--accent2:#ec4899;--text:#f1f0fb;--muted:#6b6880;--font:'Inter',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
.back-bar{padding:12px 24px;border-bottom:1px solid rgba(255,255,255,.06);}
.back-bar a{color:var(--muted);font-size:13px;text-decoration:none;}.back-bar a:hover{color:var(--text);}
.app{max-width:900px;margin:0 auto;padding:32px 20px 60px;display:grid;grid-template-columns:1fr 340px;gap:24px;}
@media(max-width:700px){.app{grid-template-columns:1fr;}}
.playlist-section h2{font-size:17px;font-weight:700;margin-bottom:16px;letter-spacing:-.3px;}
.track-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;cursor:pointer;transition:.2s;border:1px solid transparent;}
.track-item:hover{background:rgba(255,255,255,.04);}
.track-item.active{background:rgba(168,85,247,.08);border-color:rgba(168,85,247,.2);}
.track-num{width:24px;font-size:13px;color:var(--muted);text-align:center;flex-shrink:0;}
.track-item.active .track-num{color:var(--accent);}
.track-art{width:44px;height:44px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;}
.track-info{flex:1;min-width:0;}
.track-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-artist{font-size:12px;color:var(--muted);margin-top:2px;}
.track-dur{font-size:12px;color:var(--muted);flex-shrink:0;}
.eq-bars{display:flex;align-items:flex-end;gap:2px;height:16px;flex-shrink:0;}
.eq-bar{width:3px;background:var(--accent);border-radius:2px;animation:eq .6s ease-in-out infinite alternate;}
.eq-bar:nth-child(2){animation-delay:.1s;} .eq-bar:nth-child(3){animation-delay:.2s;}
@keyframes eq{from{height:4px;}to{height:14px;}}
.player{background:var(--s1);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:28px;display:flex;flex-direction:column;align-items:center;position:sticky;top:24px;height:fit-content;}
.album-art{width:180px;height:180px;border-radius:16px;margin-bottom:22px;display:flex;align-items:center;justify-content:center;font-size:80px;position:relative;overflow:hidden;}
.album-art.spinning{animation:spin 8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.now-title{font-size:17px;font-weight:700;text-align:center;margin-bottom:4px;}
.now-artist{font-size:13px;color:var(--muted);text-align:center;margin-bottom:22px;}
.progress-wrap{width:100%;margin-bottom:12px;}
.progress-bar{width:100%;height:4px;background:rgba(255,255,255,.1);border-radius:4px;cursor:pointer;position:relative;margin-bottom:6px;}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));position:relative;transition:width .3s linear;}
.progress-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:10px;height:10px;background:#fff;border-radius:50%;opacity:0;transition:.2s;}
.progress-bar:hover .progress-fill::after{opacity:1;}
.time-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
.controls{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
.ctrl{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;transition:.2s;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.ctrl:hover{color:var(--text);}
.ctrl.active{color:var(--accent);}
.play-ctrl{width:52px;height:52px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(168,85,247,.4);}
.play-ctrl:hover{transform:scale(1.08);}
.volume-row{display:flex;align-items:center;gap:10px;width:100%;}
.vol-icon{font-size:14px;color:var(--muted);}
.vol-slider{flex:1;-webkit-appearance:none;height:3px;background:rgba(255,255,255,.1);border-radius:3px;outline:none;cursor:pointer;}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--accent);border-radius:50%;cursor:pointer;}
.loading-badge{background:rgba(168,85,247,.15);color:var(--accent);font-size:11px;padding:4px 10px;border-radius:10px;margin-bottom:8px;display:none;}
.loading-badge.show{display:block;}
.cc-note{font-size:10px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5;}
.cc-note a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<div class="back-bar"><a href="index.html">← Portfolio</a></div>
<div class="app">
  <div class="playlist-section">
    <h2>🎵 Playlist — Free & Open Licensed</h2>
    <div id="playlist"></div>
    <div class="cc-note">All tracks are Creative Commons licensed.<br>Streaming via <a href="https://freemusicarchive.org" target="_blank">Free Music Archive</a> &amp; open audio CDNs.</div>
  </div>
  <div class="player">
    <div class="album-art" id="albumArt">🎵</div>
    <div class="loading-badge" id="loadBadge">Loading...</div>
    <div class="now-title" id="nowTitle">Select a track</div>
    <div class="now-artist" id="nowArtist">—</div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar" onclick="seek(event)">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="time-row">
        <span id="elapsed">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl" id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle">🔀</button>
      <button class="ctrl" onclick="prevTrack()">⏮</button>
      <button class="play-ctrl" id="playCtrl" onclick="togglePlay()">▶</button>
      <button class="ctrl" onclick="nextTrack()">⏭</button>
      <button class="ctrl" id="repeatBtn" onclick="toggleRepeat()" title="Repeat">🔁</button>
    </div>
    <div class="volume-row">
      <span class="vol-icon">🔈</span>
      <input type="range" class="vol-slider" id="vol" min="0" max="100" value="70" oninput="setVol(this.value)">
      <span class="vol-icon">🔊</span>
    </div>
  </div>
</div>

<!-- Hidden audio element -->
<audio id="audioEl" crossorigin="anonymous"></audio>

<script>
// All tracks are freely licensed (Creative Commons) MP3s from public sources
const TRACKS = [
  {
    title: 'Acid Jazz Intro',
    artist: 'Lobo Loco',
    emoji: '🎷', color: '#1a0a2e', accent: '#a855f7',
    url: 'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_01_-_Acid_Jazz_Intro_ID_1235.mp3'
  },
  {
    title: 'Funky Intro',
    artist: 'Lobo Loco',
    emoji: '🥁', color: '#0a1a0a', accent: '#22c55e',
    url: 'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_02_-_Funky_Intro_ID_1236.mp3'
  },
  {
    title: 'Jazzy Frenchy',
    artist: 'Lobo Loco',
    emoji: '🌅', color: '#1a0a12', accent: '#f97316',
    url: 'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_06_-_Jazzy_Frenchy_ID_1240.mp3'
  },
  {
    title: 'Electro Cabaret',
    artist: 'Lobo Loco',
    emoji: '🌃', color: '#0a0a1a', accent: '#06b6d4',
    url: 'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_08_-_Electro_Cabaret_ID_1242.mp3'
  },
  {
    title: 'Walk in the Park',
    artist: 'Lobo Loco',
    emoji: '🌲', color: '#0a1a0a', accent: '#22c55e',
    url: 'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_10_-_Walk_in_the_Park_ID_1244.mp3'
  },
  {
    title: 'Cinematic Tension',
    artist: 'Lobo Loco',
    emoji: '🎬', color: '#1a0a00', accent: '#eab308',
    url: 'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_12_-_Cinematic_Tension_ID_1246.mp3'
  },
  {
    title: 'Samba Tropical',
    artist: 'Lobo Loco',
    emoji: '🌺', color: '#1a0a14', accent: '#ec4899',
    url: 'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_14_-_Samba_Tropical_ID_1248.mp3'
  },
  {
    title: 'Space Ambient',
    artist: 'Lobo Loco',
    emoji: '🚀', color: '#080a14', accent: '#8b5cf6',
    url: 'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_16_-_Space_Ambient_ID_1250.mp3'
  },
];

const audio = document.getElementById('audioEl');
let current = 0, playing = false, shuffle = false, repeat = false;

audio.volume = 0.7;

function fmtTime(s) {
  if (isNaN(s) || !isFinite(s)) return '0:00';
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

function renderPlaylist() {
  document.getElementById('playlist').innerHTML = TRACKS.map((t,i) => `
    <div class="track-item${i===current?' active':''}" onclick="playTrack(${i})">
      <div class="track-num">${i===current&&playing?'<div class="eq-bars"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>':i+1}</div>
      <div class="track-art" style="background:${t.color}">${t.emoji}</div>
      <div class="track-info"><div class="track-title">${t.title}</div><div class="track-artist">${t.artist}</div></div>
    </div>`).join('');
}

function updatePlayer() {
  const t = TRACKS[current];
  document.getElementById('albumArt').textContent = t.emoji;
  document.getElementById('albumArt').style.background = `linear-gradient(135deg,${t.color},${t.accent}55)`;
  document.getElementById('albumArt').classList.toggle('spinning', playing);
  document.getElementById('nowTitle').textContent = t.title;
  document.getElementById('nowArtist').textContent = t.artist;
  document.getElementById('playCtrl').textContent = playing ? '⏸' : '▶';
}

function playTrack(i) {
  current = i;
  const t = TRACKS[i];
  audio.src = t.url;
  document.getElementById('loadBadge').classList.add('show');
  audio.load();
  audio.play().then(() => {
    playing = true;
    document.getElementById('loadBadge').classList.remove('show');
    updatePlayer(); renderPlaylist();
  }).catch(err => {
    document.getElementById('loadBadge').classList.remove('show');
    document.getElementById('nowTitle').textContent = 'Stream unavailable';
    document.getElementById('nowArtist').textContent = 'Try another track';
    playing = false; updatePlayer();
  });
}

function togglePlay() {
  if (!audio.src || !TRACKS[current].url) { playTrack(current); return; }
  if (playing) { audio.pause(); playing = false; }
  else { audio.play(); playing = true; }
  document.getElementById('albumArt').classList.toggle('spinning', playing);
  document.getElementById('playCtrl').textContent = playing ? '⏸' : '▶';
  renderPlaylist();
}

function nextTrack() {
  const n = shuffle ? Math.floor(Math.random()*TRACKS.length) : (current+1)%TRACKS.length;
  playTrack(n);
}
function prevTrack() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  const n = shuffle ? Math.floor(Math.random()*TRACKS.length) : (current-1+TRACKS.length)%TRACKS.length;
  playTrack(n);
}
function toggleShuffle() { shuffle = !shuffle; document.getElementById('shuffleBtn').classList.toggle('active', shuffle); }
function toggleRepeat() { repeat = !repeat; audio.loop = repeat; document.getElementById('repeatBtn').classList.toggle('active', repeat); }
function setVol(v) { audio.volume = v/100; }
function seek(e) {
  if (!audio.duration) return;
  const bar = e.currentTarget, rect = bar.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}

// Update progress bar
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('elapsed').textContent = fmtTime(audio.currentTime);
  document.getElementById('duration').textContent = fmtTime(audio.duration);
});

audio.addEventListener('ended', () => {
  if (!repeat) nextTrack();
});

audio.addEventListener('loadedmetadata', () => {
  document.getElementById('duration').textContent = fmtTime(audio.duration);
});

renderPlaylist(); updatePlayer();
</script>
</body>
</html>
