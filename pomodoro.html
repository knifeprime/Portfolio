<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FocusPulse — Pomodoro Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a10;--s1:#0e1219;--s2:#151b26;--accent:#ff6b6b;--green:#2dffa0;--blue:#4d96ff;--yellow:#ffd93d;--text:#e8eaf0;--muted:#5a6070;--font:'Syne',sans-serif;--mono:'DM Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;flex-direction:column;}
.back-bar{padding:12px 24px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:8px;}
.back-bar a{color:var(--muted);font-size:13px;text-decoration:none;}.back-bar a:hover{color:var(--text);}
.app{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;text-align:center;}
h1 span{color:var(--accent);}
.subtitle{color:var(--muted);font-size:14px;text-align:center;margin-bottom:36px;}
.mode-tabs{display:flex;background:var(--s1);border-radius:12px;padding:4px;margin-bottom:40px;gap:2px;}
.mode-tab{padding:10px 22px;border:none;background:transparent;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;transition:.2s;white-space:nowrap;}
.mode-tab.active{background:var(--accent);color:#fff;}
.mode-tab.break.active{background:var(--green);color:#111;}
.mode-tab.long.active{background:var(--blue);color:#fff;}
.timer-wrap{position:relative;width:260px;height:260px;margin:0 auto 36px;}
.timer-svg{position:absolute;inset:0;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:8;}
.ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .4s;}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.timer-time{font-family:var(--mono);font-size:52px;font-weight:500;letter-spacing:-2px;line-height:1;}
.timer-session{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:1px;text-transform:uppercase;}
.controls{display:flex;align-items:center;gap:14px;margin-bottom:36px;}
.play-btn{width:68px;height:68px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:24px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(255,107,107,.4);}
.play-btn.running{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.4);}50%{box-shadow:0 0 0 16px rgba(255,107,107,0);}}
.play-btn:hover{transform:scale(1.06);}
.ctrl-btn{width:44px;height:44px;border-radius:50%;background:var(--s1);border:1px solid rgba(255,255,255,.1);color:var(--text);font-size:18px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;}
.ctrl-btn:hover{background:var(--s2);}
.session-dots{display:flex;gap:8px;margin-bottom:36px;}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.1);transition:.3s;}
.dot.done{background:var(--accent);}
/* Music Player Section */
.music-section{background:var(--s1);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:20px;width:100%;max-width:460px;margin-bottom:28px;}
.music-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;justify-content:space-between;}
.music-header h3{font-size:14px;font-weight:700;letter-spacing:.3px;}
.music-playing-badge{font-size:10px;background:rgba(255,107,107,.15);color:var(--accent);padding:3px 8px;border-radius:8px;display:none;}
.music-playing-badge.show{display:block;}
.music-track-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.music-art{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.music-info{flex:1;min-width:0;}
.music-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.music-artist{font-size:11px;color:var(--muted);}
.music-controls{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.music-ctrl{background:var(--s2);border:none;color:var(--muted);font-size:16px;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.music-ctrl:hover{color:var(--text);background:rgba(255,255,255,.1);}
.music-play{width:38px;height:38px;background:var(--accent);color:#fff;font-size:16px;}
.music-play:hover{transform:scale(1.08);}
.music-progress{height:3px;background:rgba(255,255,255,.1);border-radius:3px;cursor:pointer;position:relative;}
.music-progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s linear;}
.music-time{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px;font-family:var(--mono);}
.music-vol-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.music-vol-label{font-size:12px;color:var(--muted);}
.music-vol{flex:1;-webkit-appearance:none;height:3px;background:rgba(255,255,255,.1);border-radius:3px;cursor:pointer;outline:none;}
.music-vol::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:var(--accent);border-radius:50%;cursor:pointer;}
.playlist-mini{display:flex;flex-direction:column;gap:4px;max-height:140px;overflow-y:auto;}
.ptrack{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px;transition:.15s;}
.ptrack:hover{background:rgba(255,255,255,.05);}
.ptrack.active{background:rgba(255,107,107,.1);color:var(--accent);}
.ptrack-emoji{font-size:14px;width:20px;text-align:center;}
.ptrack-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.loading-msg{font-size:11px;color:var(--muted);text-align:center;padding:6px;}
/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:420px;}
.stat{background:var(--s1);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px;text-align:center;}
.stat-val{font-size:22px;font-weight:800;font-family:var(--mono);}
.stat-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}
</style>
</head>
<body>
<div class="back-bar"><a href="index.html">← Portfolio</a></div>
<div class="app">
  <h1>Focus<span>Pulse</span></h1>
  <div class="subtitle">Stay in the zone. Pomodoro timer with music.</div>
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('focus',this)">🎯 Focus</button>
    <button class="mode-tab break" onclick="setMode('short',this)">☕ Short Break</button>
    <button class="mode-tab long" onclick="setMode('long',this)">🌙 Long Break</button>
  </div>
  <div class="timer-wrap">
    <svg class="timer-svg" viewBox="0 0 260 260">
      <circle class="ring-bg" cx="130" cy="130" r="115"/>
      <circle class="ring-fill" id="ring" cx="130" cy="130" r="115" stroke="#ff6b6b"/>
    </svg>
    <div class="timer-center">
      <div class="timer-time" id="timerDisplay">25:00</div>
      <div class="timer-session" id="sessionLabel">Session 1 of 4</div>
    </div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" onclick="skip(-1)">⏮</button>
    <button class="play-btn" id="playBtn" onclick="toggleTimer()">▶</button>
    <button class="ctrl-btn" onclick="skip(1)">⏭</button>
  </div>
  <div class="session-dots" id="sessionDots"></div>

  <!-- Music Player -->
  <div class="music-section">
    <div class="music-header">
      <h3>🎵 Focus Music</h3>
      <span class="music-playing-badge" id="playingBadge">▶ Playing</span>
    </div>
    <div class="music-track-row">
      <div class="music-art" id="mArt" style="background:#1a0a2e">🎵</div>
      <div class="music-info">
        <div class="music-title" id="mTitle">Select a track</div>
        <div class="music-artist" id="mArtist">Free CC Licensed Music</div>
      </div>
    </div>
    <div class="music-controls">
      <button class="music-ctrl" onclick="mPrev()">⏮</button>
      <button class="music-ctrl music-play" id="mPlayBtn" onclick="mToggle()">▶</button>
      <button class="music-ctrl" onclick="mNext()">⏭</button>
      <button class="music-ctrl" id="mRepeatBtn" onclick="mToggleRepeat()" title="Repeat">🔁</button>
      <button class="music-ctrl" id="mShuffleBtn" onclick="mToggleShuffle()" title="Shuffle">🔀</button>
    </div>
    <div class="music-progress" id="mProgressBar" onclick="mSeek(event)">
      <div class="music-progress-fill" id="mProgressFill" style="width:0%"></div>
    </div>
    <div class="music-time"><span id="mElapsed">0:00</span><span id="mDur">0:00</span></div>
    <div class="music-vol-row">
      <span class="music-vol-label">🔈</span>
      <input type="range" class="music-vol" id="mVol" min="0" max="100" value="60" oninput="mSetVol(this.value)">
      <span class="music-vol-label">🔊</span>
    </div>
    <div style="margin-top:14px;margin-bottom:6px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;">PLAYLIST</div>
    <div class="playlist-mini" id="mPlaylist"></div>
    <div class="loading-msg" id="mLoadMsg"></div>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="stat-val" id="totalSessions" style="color:var(--accent)">0</div><div class="stat-lbl">Sessions</div></div>
    <div class="stat"><div class="stat-val" id="totalFocus" style="color:var(--green)">0h</div><div class="stat-lbl">Focus Time</div></div>
    <div class="stat"><div class="stat-val" id="streak" style="color:var(--yellow)">0</div><div class="stat-lbl">Streak</div></div>
  </div>
</div>

<audio id="mAudio" crossorigin="anonymous"></audio>

<script>
// ── Pomodoro logic ──
const MODES = {focus:{mins:25,label:'Focus',color:'#ff6b6b'},short:{mins:5,label:'Short Break',color:'#2dffa0'},long:{mins:15,label:'Long Break',color:'#4d96ff'}};
let mode='focus',running=false,secs=25*60,totalSecs=25*60,interval=null,session=1,totalSessions=0,totalFocusMins=0;
const CIRCUMFERENCE=2*Math.PI*115;
const ring=document.getElementById('ring');
ring.style.strokeDasharray=CIRCUMFERENCE;

function setMode(m,btn){
  mode=m;running=false;clearInterval(interval);
  document.getElementById('playBtn').textContent='▶';
  document.getElementById('playBtn').classList.remove('running');
  document.querySelectorAll('.mode-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  secs=MODES[m].mins*60;totalSecs=secs;
  ring.style.stroke=MODES[m].color;
  document.querySelector('.play-btn').style.background=MODES[m].color;
  updateDisplay();updateDots();
}

function toggleTimer(){
  running=!running;
  if(running){interval=setInterval(tick,1000);document.getElementById('playBtn').textContent='⏸';document.getElementById('playBtn').classList.add('running');}
  else{clearInterval(interval);document.getElementById('playBtn').textContent='▶';document.getElementById('playBtn').classList.remove('running');}
}

function tick(){
  secs--;
  if(secs<=0){
    secs=0;updateDisplay();clearInterval(interval);running=false;
    document.getElementById('playBtn').textContent='▶';
    document.getElementById('playBtn').classList.remove('running');
    if(mode==='focus'){totalSessions++;totalFocusMins+=MODES.focus.mins;updateStats();session=session<4?session+1:1;}
    notify();
    setTimeout(()=>autoNext(),1200);
    return;
  }
  updateDisplay();
}

function autoNext(){
  if(mode==='focus'){if(session===1)setMode('short',document.querySelectorAll('.mode-tab')[1]);else setMode('long',document.querySelectorAll('.mode-tab')[2]);}
  else setMode('focus',document.querySelectorAll('.mode-tab')[0]);
}

function skip(dir){secs=Math.max(0,Math.min(totalSecs,secs+dir*60));updateDisplay();}

function updateDisplay(){
  const m=String(Math.floor(secs/60)).padStart(2,'0'),s=String(secs%60).padStart(2,'0');
  document.getElementById('timerDisplay').textContent=`${m}:${s}`;
  document.getElementById('sessionLabel').textContent=`${MODES[mode].label} — Session ${session} of 4`;
  ring.style.strokeDashoffset=CIRCUMFERENCE*(1-secs/totalSecs);
}

function updateDots(){
  document.getElementById('sessionDots').innerHTML=[1,2,3,4].map(i=>`<div class="dot${i<session?' done':''}"></div>`).join('');
}

function updateStats(){
  document.getElementById('totalSessions').textContent=totalSessions;
  const h=Math.floor(totalFocusMins/60),m=totalFocusMins%60;
  document.getElementById('totalFocus').textContent=h>0?`${h}h${m}m`:`${m}m`;
  document.getElementById('streak').textContent=totalSessions;
  updateDots();
}

function notify(){
  if('Notification' in window&&Notification.permission==='granted')
    new Notification('FocusPulse',{body:mode==='focus'?'Focus done! Take a break.':'Break over! Back to work.'});
}
if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();

// ── Music Player ──
const MUSIC_TRACKS = [
  {title:'Acid Jazz Intro', artist:'Lobo Loco', emoji:'🎷', bg:'#1a0a2e',
   url:'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_01_-_Acid_Jazz_Intro_ID_1235.mp3'},
  {title:'Funky Intro', artist:'Lobo Loco', emoji:'🥁', bg:'#0a1a0a',
   url:'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_02_-_Funky_Intro_ID_1236.mp3'},
  {title:'Jazzy Frenchy', artist:'Lobo Loco', emoji:'🌅', bg:'#1a0a12',
   url:'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_06_-_Jazzy_Frenchy_ID_1240.mp3'},
  {title:'Electro Cabaret', artist:'Lobo Loco', emoji:'🌃', bg:'#0a0a1a',
   url:'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_08_-_Electro_Cabaret_ID_1242.mp3'},
  {title:'Walk in the Park', artist:'Lobo Loco', emoji:'🌲', bg:'#0a1a0a',
   url:'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_10_-_Walk_in_the_Park_ID_1244.mp3'},
  {title:'Cinematic Tension', artist:'Lobo Loco', emoji:'🎬', bg:'#1a0a00',
   url:'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_12_-_Cinematic_Tension_ID_1246.mp3'},
  {title:'Samba Tropical', artist:'Lobo Loco', emoji:'🌺', bg:'#1a0a14',
   url:'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_14_-_Samba_Tropical_ID_1248.mp3'},
  {title:'Space Ambient', artist:'Lobo Loco', emoji:'🚀', bg:'#080a14',
   url:'https://files.freemusicarchive.org/storage-freemusicarchive-org/music/WFMU/Lobo_Loco/Creative_Common_Music_for_Multimedia/Lobo_Loco_-_16_-_Space_Ambient_ID_1250.mp3'},
];

const mAudio = document.getElementById('mAudio');
let mCurrent = 0, mPlaying = false, mRepeat = false, mShuffle = false;
mAudio.volume = 0.6;

function mFmt(s){if(isNaN(s)||!isFinite(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}

function mRenderPlaylist(){
  document.getElementById('mPlaylist').innerHTML = MUSIC_TRACKS.map((t,i)=>`
    <div class="ptrack${i===mCurrent?' active':''}" onclick="mPlayTrack(${i})">
      <span class="ptrack-emoji">${t.emoji}</span>
      <span class="ptrack-name">${t.title}</span>
    </div>`).join('');
}

function mUpdateUI(){
  const t = MUSIC_TRACKS[mCurrent];
  document.getElementById('mArt').textContent = t.emoji;
  document.getElementById('mArt').style.background = t.bg;
  document.getElementById('mTitle').textContent = t.title;
  document.getElementById('mArtist').textContent = t.artist;
  document.getElementById('mPlayBtn').textContent = mPlaying ? '⏸' : '▶';
  document.getElementById('playingBadge').classList.toggle('show', mPlaying);
  mRenderPlaylist();
}

function mPlayTrack(i){
  mCurrent = i;
  const t = MUSIC_TRACKS[i];
  document.getElementById('mLoadMsg').textContent = 'Loading...';
  mAudio.src = t.url;
  mAudio.load();
  mAudio.play().then(()=>{
    mPlaying = true;
    document.getElementById('mLoadMsg').textContent = '';
    mUpdateUI();
  }).catch(()=>{
    document.getElementById('mLoadMsg').textContent = 'Stream unavailable, try next track';
    mPlaying = false; mUpdateUI();
  });
}

function mToggle(){
  if(!mAudio.src || mAudio.src === window.location.href){mPlayTrack(mCurrent);return;}
  if(mPlaying){mAudio.pause();mPlaying=false;}
  else{mAudio.play();mPlaying=true;}
  mUpdateUI();
}

function mNext(){const n=mShuffle?Math.floor(Math.random()*MUSIC_TRACKS.length):(mCurrent+1)%MUSIC_TRACKS.length;mPlayTrack(n);}
function mPrev(){if(mAudio.currentTime>3){mAudio.currentTime=0;return;}const n=mShuffle?Math.floor(Math.random()*MUSIC_TRACKS.length):(mCurrent-1+MUSIC_TRACKS.length)%MUSIC_TRACKS.length;mPlayTrack(n);}
function mToggleRepeat(){mRepeat=!mRepeat;mAudio.loop=mRepeat;document.getElementById('mRepeatBtn').style.color=mRepeat?'var(--accent)':'var(--muted)';}
function mToggleShuffle(){mShuffle=!mShuffle;document.getElementById('mShuffleBtn').style.color=mShuffle?'var(--accent)':'var(--muted)';}
function mSetVol(v){mAudio.volume=v/100;}
function mSeek(e){if(!mAudio.duration)return;const bar=e.currentTarget,rect=bar.getBoundingClientRect();mAudio.currentTime=((e.clientX-rect.left)/rect.width)*mAudio.duration;}

mAudio.addEventListener('timeupdate',()=>{
  if(!mAudio.duration)return;
  document.getElementById('mProgressFill').style.width=(mAudio.currentTime/mAudio.duration*100)+'%';
  document.getElementById('mElapsed').textContent=mFmt(mAudio.currentTime);
  document.getElementById('mDur').textContent=mFmt(mAudio.duration);
});
mAudio.addEventListener('ended',()=>{if(!mRepeat)mNext();});

updateDisplay();updateDots();mUpdateUI();mRenderPlaylist();
</script>
</body>
</html>
