<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MemFlip — Memory Card Game</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0a2e;--s1:#231040;--s2:#2d1655;--accent:#c84bff;--gold:#ffd700;--green:#2dff7f;--red:#ff4d6d;--font:'Nunito',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:#fff;font-family:var(--font);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(200,75,255,.12),transparent 70%);pointer-events:none;}
.back-bar{padding:12px 24px;border-bottom:1px solid rgba(255,255,255,.08);}
.back-bar a{color:rgba(255,255,255,.5);font-size:13px;text-decoration:none;}.back-bar a:hover{color:#fff;}
.app{max-width:700px;margin:0 auto;padding:30px 16px 60px;text-align:center;}
h1{font-size:clamp(28px,6vw,42px);font-weight:900;letter-spacing:-1px;margin-bottom:6px;}
h1 span{color:var(--accent);}
.subtitle{color:rgba(255,255,255,.5);font-size:14px;margin-bottom:28px;}
.hud{display:flex;justify-content:center;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
.hud-item{background:var(--s1);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 22px;min-width:90px;}
.hud-val{font-size:24px;font-weight:900;}
.hud-label{font-size:11px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.hud-moves .hud-val{color:var(--gold);}
.hud-time .hud-val{color:var(--accent);}
.hud-score .hud-val{color:var(--green);}
.ctrl-row{display:flex;gap:10px;justify-content:center;margin-bottom:28px;flex-wrap:wrap;}
.ctrl-btn{padding:10px 20px;border:none;border-radius:8px;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;}
.ctrl-btn.primary{background:var(--accent);color:#fff;}
.ctrl-btn.primary:hover{background:#db70ff;box-shadow:0 0 18px rgba(200,75,255,.5);}
.ctrl-btn.sec{background:var(--s1);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.1);}
.ctrl-btn.sec:hover{background:var(--s2);}
.diff-row{display:flex;gap:8px;justify-content:center;margin-bottom:24px;}
.diff-btn{padding:6px 14px;background:var(--s1);border:1px solid rgba(255,255,255,.1);border-radius:20px;color:rgba(255,255,255,.5);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:.2s;}
.diff-btn.active,.diff-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.grid{display:grid;gap:10px;justify-content:center;margin:0 auto;}
.card{perspective:600px;cursor:pointer;}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.22,1,.36,1);}
.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.card-back{background:linear-gradient(135deg,var(--s2),var(--accent) 200%);border:2px solid rgba(200,75,255,.3);}
.unknown-wrap{width:50%;height:50%;animation:unknownPulse 3s ease-in-out infinite;}
@keyframes unknownPulse{0%,100%{transform:rotate(0deg) scale(1);opacity:.4;}50%{transform:rotate(180deg) scale(1.1);opacity:.7;}}
.card-front{background:var(--s1);border:2px solid rgba(255,255,255,.1);transform:rotateY(180deg);}
.card-front svg{width:58%;height:58%;}
.card.matched .card-front{border-color:var(--green);background:rgba(45,255,127,.08);animation:matchPop .4s ease;}
@keyframes matchPop{0%{transform:rotateY(180deg) scale(1);}50%{transform:rotateY(180deg) scale(1.12);}100%{transform:rotateY(180deg) scale(1);}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:99;opacity:0;pointer-events:none;transition:.3s;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal{background:var(--s1);border:1px solid rgba(200,75,255,.3);border-radius:20px;padding:40px 36px;text-align:center;max-width:360px;width:90%;animation:modalIn .4s ease;}
@keyframes modalIn{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal h2{font-size:28px;font-weight:900;margin-bottom:8px;}
.modal p{color:rgba(255,255,255,.6);margin-bottom:24px;}
.modal .big-emoji{font-size:60px;margin-bottom:12px;}
.best-score{background:rgba(200,75,255,.1);border-radius:10px;padding:12px;font-size:13px;color:var(--gold);margin-bottom:16px;}
</style>
</head>
<body>
<div class="back-bar"><a href="index.html">← Portfolio</a></div>
<div class="app">
  <h1>Mem<span>Flip</span> 🔷</h1>
  <div class="subtitle">Match all shape pairs. How fast can you do it?</div>
  <div class="hud">
    <div class="hud-item hud-moves"><div class="hud-val" id="moves">0</div><div class="hud-label">Moves</div></div>
    <div class="hud-item hud-time"><div class="hud-val" id="timer">00:00</div><div class="hud-label">Time</div></div>
    <div class="hud-item hud-score"><div class="hud-val" id="matches">0</div><div class="hud-label">Matched</div></div>
    <div class="hud-item"><div class="hud-val" id="bestVal" style="color:var(--gold)">—</div><div class="hud-label">Best</div></div>
  </div>
  <div class="diff-row">
    <button class="diff-btn active" onclick="setDiff(4,this)">4x4</button>
    <button class="diff-btn" onclick="setDiff(5,this)">5x4</button>
    <button class="diff-btn" onclick="setDiff(6,this)">6x6</button>
  </div>
  <div class="ctrl-row">
    <button class="ctrl-btn primary" onclick="startGame()">New Game</button>
    <button class="ctrl-btn sec" onclick="revealAll()">Peek</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="big-emoji">🎉</div>
    <h2>You Won!</h2>
    <p id="winMsg">Congratulations!</p>
    <div class="best-score" id="bestMsg"></div>
    <button class="ctrl-btn primary" onclick="closeModal();startGame()" style="width:100%">Play Again</button>
  </div>
</div>

<script>
const SHAPES = [
  {id:'circle', color:'#ff4d6d', svg:'<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="24" fill="#ff4d6d"/></svg>'},
  {id:'triangle', color:'#ffd700', svg:'<svg viewBox="0 0 60 60"><polygon points="30,5 57,53 3,53" fill="#ffd700"/></svg>'},
  {id:'square', color:'#00d4ff', svg:'<svg viewBox="0 0 60 60"><rect x="8" y="8" width="44" height="44" rx="5" fill="#00d4ff"/></svg>'},
  {id:'diamond', color:'#2dff7f', svg:'<svg viewBox="0 0 60 60"><polygon points="30,4 56,30 30,56 4,30" fill="#2dff7f"/></svg>'},
  {id:'pentagon', color:'#ff9f43', svg:'<svg viewBox="0 0 60 60"><polygon points="30,4 56,22 46,53 14,53 4,22" fill="#ff9f43"/></svg>'},
  {id:'hexagon', color:'#c84bff', svg:'<svg viewBox="0 0 60 60"><polygon points="30,4 52,17 52,43 30,56 8,43 8,17" fill="#c84bff"/></svg>'},
  {id:'star', color:'#f5c842', svg:'<svg viewBox="0 0 60 60"><polygon points="30,4 36,22 56,22 40,34 46,54 30,42 14,54 20,34 4,22 24,22" fill="#f5c842"/></svg>'},
  {id:'heart', color:'#ff6eb4', svg:'<svg viewBox="0 0 60 60"><path d="M30 50 C30 50 6 34 6 20 C6 12 12 6 20 6 C24 6 28 8 30 12 C32 8 36 6 40 6 C48 6 54 12 54 20 C54 34 30 50 30 50Z" fill="#ff6eb4"/></svg>'},
  {id:'cross', color:'#26d7c4', svg:'<svg viewBox="0 0 60 60"><rect x="22" y="4" width="16" height="52" rx="4" fill="#26d7c4"/><rect x="4" y="22" width="52" height="16" rx="4" fill="#26d7c4"/></svg>'},
  {id:'ring', color:'#e040fb', svg:'<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="24" fill="none" stroke="#e040fb" stroke-width="10"/></svg>'},
  {id:'arrow', color:'#b2ff59', svg:'<svg viewBox="0 0 60 60"><polygon points="30,4 56,30 42,30 42,56 18,56 18,30 4,30" fill="#b2ff59"/></svg>'},
  {id:'octagon', color:'#ff7043', svg:'<svg viewBox="0 0 60 60"><polygon points="20,4 40,4 56,20 56,40 40,56 20,56 4,40 4,20" fill="#ff7043"/></svg>'},
  {id:'lightning', color:'#d4e157', svg:'<svg viewBox="0 0 60 60"><polygon points="36,4 14,34 28,34 22,56 46,26 32,26" fill="#d4e157"/></svg>'},
  {id:'crescent', color:'#b39ddb', svg:'<svg viewBox="0 0 60 60"><path d="M42 8 A24 24 0 1 0 42 52 A16 16 0 1 1 42 8Z" fill="#b39ddb"/></svg>'},
  {id:'teardrop', color:'#ffab76', svg:'<svg viewBox="0 0 60 60"><path d="M30 6 C46 20 50 34 30 54 C10 34 14 20 30 6Z" fill="#ffab76"/></svg>'},
  {id:'bowtie', color:'#29b6f6', svg:'<svg viewBox="0 0 60 60"><polygon points="4,4 56,4 32,30 56,56 4,56 28,30" fill="#29b6f6"/></svg>'},
  {id:'parallelogram', color:'#aed581', svg:'<svg viewBox="0 0 60 60"><polygon points="18,8 58,8 42,52 2,52" fill="#aed581"/></svg>'},
  {id:'oval', color:'#f48fb1', svg:'<svg viewBox="0 0 60 60"><ellipse cx="30" cy="30" rx="26" ry="16" fill="#f48fb1"/></svg>'},
];

// SVG shown on card back — abstract animated unknown shape
const UNKNOWN_SVG = `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <polygon points="30,10 50,20 50,40 30,50 10,40 10,20" fill="none" stroke="rgba(200,75,255,0.5)" stroke-width="2.5"/>
  <polygon points="30,16 44,23 44,37 30,44 16,37 16,23" fill="none" stroke="rgba(200,75,255,0.35)" stroke-width="2"/>
  <circle cx="30" cy="30" r="6" fill="rgba(200,75,255,0.4)"/>
  <line x1="30" y1="4" x2="30" y2="16" stroke="rgba(200,75,255,0.3)" stroke-width="2"/>
  <line x1="30" y1="44" x2="30" y2="56" stroke="rgba(200,75,255,0.3)" stroke-width="2"/>
  <line x1="4" y1="30" x2="16" y2="30" stroke="rgba(200,75,255,0.3)" stroke-width="2"/>
  <line x1="44" y1="30" x2="56" y2="30" stroke="rgba(200,75,255,0.3)" stroke-width="2"/>
</svg>`;

let cols=4,total=16,flipped=[],matched=[],moves=0,timerInt=null,secs=0,started=false,locked=false;

function setDiff(c,btn){cols=c;total=c*(c===5?4:c);document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');startGame();}

function startGame(){
  clearInterval(timerInt);secs=0;moves=0;flipped=[];matched=[];started=false;locked=false;
  updateHUD();
  const shapes=SHAPES.slice(0,total/2);
  const deck=[...shapes,...shapes].sort(()=>Math.random()-.5);
  const grid=document.getElementById('grid');
  const sz=cols===6?85:cols===5?90:100;
  grid.style.gridTemplateColumns=`repeat(${cols},${sz}px)`;
  grid.innerHTML=deck.map((s,i)=>`
    <div class="card" style="width:${sz}px;height:${sz}px;" onclick="flip(this,${i})" data-i="${i}" data-shape="${s.id}">
      <div class="card-inner">
        <div class="card-face card-back"><div class="unknown-wrap">${UNKNOWN_SVG}</div></div>
        <div class="card-face card-front">${s.svg}</div>
      </div>
    </div>`).join('');
}

function flip(card,i){
  if(locked||matched.includes(i)||flipped.includes(i)||card.classList.contains('matched'))return;
  if(!started){started=true;timerInt=setInterval(tick,1000);}
  card.classList.add('flipped');flipped.push(i);
  if(flipped.length===2){
    moves++;document.getElementById('moves').textContent=moves;locked=true;
    const cards=document.querySelectorAll('.card');
    const [a,b]=flipped;
    if(cards[a].dataset.shape===cards[b].dataset.shape){
      matched.push(a,b);
      cards[a].classList.replace('flipped','matched');
      cards[b].classList.replace('flipped','matched');
      flipped=[];locked=false;
      document.getElementById('matches').textContent=matched.length/2;
      if(matched.length===total){win();}
    } else {
      setTimeout(()=>{cards[a].classList.remove('flipped');cards[b].classList.remove('flipped');flipped=[];locked=false;},900);
    }
  }
}

function tick(){secs++;const m=String(Math.floor(secs/60)).padStart(2,'0'),s=String(secs%60).padStart(2,'0');document.getElementById('timer').textContent=`${m}:${s}`;}

function win(){
  clearInterval(timerInt);
  const key=`memflip_shapes_best_${cols}`;
  const prev=parseInt(localStorage.getItem(key)||'99999');
  const score=moves*10+secs;
  if(score<prev)localStorage.setItem(key,score);
  document.getElementById('winMsg').textContent=`${moves} moves in ${document.getElementById('timer').textContent}`;
  document.getElementById('bestMsg').textContent=`Best score: ${Math.min(score,prev)} pts`;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}
function revealAll(){document.querySelectorAll('.card:not(.matched)').forEach(c=>c.classList.add('flipped'));setTimeout(()=>document.querySelectorAll('.card:not(.matched)').forEach(c=>c.classList.remove('flipped')),1500);}
function updateHUD(){document.getElementById('moves').textContent=0;document.getElementById('timer').textContent='00:00';document.getElementById('matches').textContent=0;}

startGame();
</script>
</body>
</html>
